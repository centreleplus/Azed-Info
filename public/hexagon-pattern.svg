<svg xmlns="http://www.w3.org/2000/svg" width="120" height="104" viewBox="0 0 120 104">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <style>
    .hex { fill: none; stroke: #3b82f6; stroke-width: 1; stroke-opacity: 0.18; stroke-dasharray: 100; }
    .dot { fill: #2563eb; fill-opacity: 0.25; }
    .line { stroke: #60a5fa; stroke-width: 0.75; stroke-opacity: 0.15; }
  </style>
  <g>
    <!-- Hexagon 1 -->
    <polygon class="hex" points="30,0 60,0 75,26 60,52 30,52 15,26"/>
    <!-- Hexagon 2 -->
    <polygon class="hex" points="90,0 120,0 135,26 120,52 90,52 75,26"/>
    <!-- Hexagon 3 -->
    <polygon class="hex" points="60,52 90,52 105,78 90,104 60,104 45,78"/>
    <!-- Hexagon 4 -->
    <polygon class="hex" points="0,52 30,52 45,78 30,104 0,104 -15,78"/>
    
    <!-- Nodes -->
    <circle class="dot" cx="30" cy="0" r="2.5"/>
    <circle class="dot" cx="60" cy="0" r="2.5"/>
    <circle class="dot" cx="75" cy="26" r="2.5"/>
    <circle class="dot" cx="60" cy="52" r="2.5"/>
    <circle class="dot" cx="30" cy="52" r="2.5"/>
    <circle class="dot" cx="15" cy="26" r="2.5"/>
    
    <circle class="dot" cx="105" cy="78" r="2.5"/>
    <circle class="dot" cx="45" cy="78" r="2.5"/>
  </g>
</svg>
